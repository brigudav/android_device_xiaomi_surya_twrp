name: TWRP Build patches

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Amazeble/android_device_xiaomi_surya_twrp/'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/surya'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'surya'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendorboot
      APPLYPATCH:
        description: 'Apply diff.patch (true or false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      UPLOAD:
        description: 'Upload to Telegram Bot (true or false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      PUBLISH:
        description: 'Publish to GitHub (true or false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup Actions Workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare Local Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev \
          x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool \
          squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3

      - name: Setup Java Build Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Verified Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize Source Tree Workspace
        id: pwd
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          mkdir -p twrp
          cd twrp
          echo "wsdir=$PWD" >> $GITHUB_OUTPUT
          git config --global user.name "Amazeble"
          git config --global user.email "amazeble@example.com"
          
          MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
          
          repo init --depth=1 --no-repo-verify -u "$MANIFEST_URL" -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Sync Source Code
        run: |
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Repopick Tree Patches
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          source build/envsetup.sh
          echo "Skipping repopick 7203 due to SSL certificate issues with gerrit.twrp.me"
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Clone Custom Surya Device Tree
        run: |
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Set Server Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Execute Compiler Engine
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          
          TREE_TYPE="twrp"
          
          lunch ${TREE_TYPE}_${{ github.event.inputs.DEVICE_NAME }}-eng
          make clean
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Set Build Parameters
        run: |
          echo "date=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          echo "Outdir=${GITHUB_WORKSPACE}/twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_OUTPUT
        id: var

      - name: Pack Output Asset
        run: |
          cd ${{ steps.var.outputs.Outdir }}
          zip -9 twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ steps.var.outputs.date }}.zip ${{ github.event.inputs.BUILD_TARGET }}.img
          echo "name=$(find * -name *.zip -type f)" >> $GITHUB_OUTPUT
        id: zipname

      - name: Publish Compiled Zip Asset to Releases
        if: github.event.inputs.PUBLISH == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.var.outputs.Outdir }}/${{ steps.zipname.outputs.name }}
          name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} - Build ${{ steps.var.outputs.date }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
