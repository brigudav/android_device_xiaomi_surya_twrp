name: TWRP Build patches

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-11
          - twrp-9.0
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/surya'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'surya'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendorboot
      APPLYPATCH:
        description: 'Apply diff.patch (true or false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      UPLOAD:
        description: 'Upload to Telegram Bot (true or false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      PUBLISH:
        description: 'Publish to GitHub (true or false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/sushrut1101/docker-tw外:latest  # Uses a pre-built Android build container sandbox
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo tree
        run: |
          mkdir twrp
          cd twrp
          echo "wsdir=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "Amazeble"
          git config --global user.email "amazeble@example.com"
          
          # Dynamic manifest selection
          if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-11" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-12.1" ]; then
            MANIFEST_URL="https://github.com"
          else
            MANIFEST_URL="https://github.com"
          fi
          
          repo init --depth=1 -u "$MANIFEST_URL" -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        id: pwd

      - name: Sync Source Code
        run: |
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Repopick Patches
        run: |
          source build/envsetup.sh
          repopick 7203
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Clone device tree
        run: |
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Compiling Image
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          
          if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-11" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-12.1" ]; then
            TREE_TYPE="twrp"
          else
            TREE_TYPE="omni"
          fi
          
          lunch ${TREE_TYPE}_${{ github.event.inputs.DEVICE_NAME }}-eng
          make clean
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        working-directory: ${{ steps.pwd.outputs.wsdir }}

      - name: Set Output Variables
        run: |
          echo "date=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          echo "Outdir=${GITHUB_WORKSPACE}/twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_OUTPUT
        id: var

      - name: Compress Output Binary
        run: |
          cd ${{ steps.var.outputs.Outdir }}
          zip -9 twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ steps.var.outputs.date }}.zip ${{ github.event.inputs.BUILD_TARGET }}.img
          echo "name=$(find * -name *.zip -type f)" >> $GITHUB_OUTPUT
        id: zipname

      - name: Publish to GitHub Releases
        if: github.event.inputs.PUBLISH == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.var.outputs.Outdir }}/${{ steps.zipname.outputs.name }}
          name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} - Build ${{ steps.var.outputs.date }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
